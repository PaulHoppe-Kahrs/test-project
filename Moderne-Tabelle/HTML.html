<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Holzhandel - Preisliste</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="price-page">
		<h1>Holzhandel</h1>
		<p>Unsere aktuellen Holzsorten und ihre Verfügbarkeit.</p>

		<div class="table-wrapper">
			<table>
				<thead>
					<tr>
						<th scope="col">Holzsorte</th>
						<th scope="col">Preis pro Einheit</th>
						<th scope="col">Verfügbarkeit</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<th scope="row">Fichtenholz</th>
						<td>35,00 € / m³</td>
						<td><span class="status available">Verfügbar</span></td>
					</tr>
					<tr>
						<th scope="row">Eichenholz</th>
						<td>85,00 € / m³</td>
						<td><span class="status available">Verfügbar</span></td>
					</tr>
					<tr>
						<th scope="row">Buchenholz</th>
						<td>70,00 € / m³</td>
						<td><span class="status limited">Wenige verfügbar</span></td>
					</tr>
					<tr>
						<th scope="row">Kiefernholz</th>
						<td>42,00 € / m³</td>
						<td><span class="status unavailable">Ausverkauft</span></td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
