<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive Bildergalerie</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="gallery-page">
		<h1>Meine Bildergalerie</h1>
		<p class="intro">Eine kleine Galerie, die sich flexibel an deine Bildschirmgröße anpasst.</p>

		<div class="gallery-container">
			<div class="gallery-item">
				<img src="1.jpeg" alt="Galeriebild 1">
				<p>Bild 1</p>
			</div>
			<div class="gallery-item">
				<img src="2.jpeg" alt="Galeriebild 2">
				<p>Bild 2</p>
			</div>
			<div class="gallery-item">
				<img src="3.jpeg" alt="Galeriebild 3">
				<p>Bild 3</p>
			</div>
			<div class="gallery-item">
				<img src="4.jpeg" alt="Galeriebild 4">
				<p>Bild 4</p>
			</div>
		</div>
	</main>
</body>
</html>
