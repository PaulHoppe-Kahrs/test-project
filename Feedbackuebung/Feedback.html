<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <hr class="horizontal-line" />

    <img class="logo" src="dc.png" alt="Firmen-Logo" />
    <h1 id="header">Gib uns dein Feedback!</h1>
    <form>
      <input
        type="text"
        placeholder="Dein Name:"
        class="name-field"
      />
      <input
        type="email"
        placeholder="Hier kommt deine Email-Adresse hinein"
        class="email-field"
      />
      <textarea
        placeholder="Hier kommt dein Feedback hinein"
        class="feedback-field"
      ></textarea>
      <button type="submit" class="send-button">Absenden</button>
    </form>
  </body>
</html>
