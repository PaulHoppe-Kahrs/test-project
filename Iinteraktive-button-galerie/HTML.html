<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interaktive Button-Galerie</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Button-Galerie</h1>
      <div class="button-container">
        <button class="button button-color" type="button">Farbwechsel</button>
        <button class="button button-border" type="button">
          Rahmen ändern
        </button>
        <button class="button button-padding" type="button">
          Padding ändern
        </button>
        <button class="button button-shadow" type="button">
          Schatten-Effekt
        </button>
      </div>
    </main>
  </body>
</html>
