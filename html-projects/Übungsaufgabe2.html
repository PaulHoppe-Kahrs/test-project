<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Einen Titel im head-Bereich, der "Meine erste interaktive Seite" lautet. -->
  <title>Meine erste interaktive Website</title>
</head>
<body>
  <!-- Ein Hauptüberschrift (h1-Tag) im body der Seite, die ebenfalls "Meine erste interaktive Seite" lautet. -->
  <h1>Meine erste interaktive Website</h1>

  <!-- Einen Absatz (p-Tag) mit dem Text: "Willkommen auf meiner Webseite. Hier findest du einige nützliche Links und Buttons!" -->
  <p>Willkommen auf meiner Webseite. Hier findest du einige nützliche Links und Buttons!</p>

  <!-- Einen Link (a-Tag) zu einer anderen Seite, z.B. "https://www.example.com", mit dem Text "Besuche Example.com". -->
  <a href="https://www.example.com" target="_blank" rel="noopener noreferrer">
    Besuche Example.com

<!-- Einen Button (button-Tag), der "Klick mich!" besagt. Dieser Button muss nichts tun, wenn man darauf klickt (kein JavaScript erforderlich).-->
    <button>
      Klick mich!
    </button>

  </a>
</body>
</html>
